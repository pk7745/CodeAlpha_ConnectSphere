# ConnectSphere Render Free-Tier Infrastructure Blueprint
# Deploys the Frontend as a Static Site (Free) and Backend as a Web Service (Free).
# Database: Neon Serverless PostgreSQL (configured via DATABASE_URL).
# Storage: Supabase Storage Free Tier (configured via SUPABASE_URL & SUPABASE_SERVICE_ROLE_KEY).
# Filesystem on Render free tier is treated as strictly ephemeral.

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API & Real-Time WebRTC/Socket.IO Server (Render Free Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: connectsphere-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # Paste your Neon PostgreSQL connection string here:
        # postgresql://USER:PASSWORD@HOST/DATABASE?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: static
          name: connectsphere-client
          property: url
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: connectsphere-files
      - key: GEMINI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend React 18 + Vite SPA Static Site (Render Free Static Site)
  # ---------------------------------------------------------------------------
  - type: static
    name: connectsphere-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback routing: Rewrite all non-file requests to /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: connectsphere-server
          property: url
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: connectsphere-server
          property: url
