# ConnectSphere Render Infrastructure Blueprint
# Deploys the Frontend as a Static Site and the Backend as a Web Service.
# Neon PostgreSQL is configured externally via DATABASE_URL.

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API & Real-Time WebRTC/Socket.IO Server
  # ---------------------------------------------------------------------------
  - type: web
    name: connectsphere-server
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # Paste your Neon PostgreSQL connection string here:
        # postgresql://user:password@ep-xyz.neon.tech/connectsphere?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: static
          name: connectsphere-client
          property: url
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: connectsphere-uploads
      mountPath: /var/data/uploads
      sizeGB: 1

  # ---------------------------------------------------------------------------
  # 2. Frontend React 18 + Vite SPA Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: connectsphere-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback routing: Rewrite all non-file requests to /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: connectsphere-server
          property: url
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: connectsphere-server
          property: url
